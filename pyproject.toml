[project]
name = "insidethegame"
version = "0.1.0"
description = "Multi-agent commentary room: synthetic football events -> explainable match intelligence"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[project.optional-dependencies]
azure = ["openai>=1.40", "azure-identity>=1.17"]
otel = ["opentelemetry-sdk>=1.30", "opentelemetry-exporter-otlp>=1.30"]
agents = ["agent-framework-core>=1.22", "agent-framework-openai>=1.17", "python-dotenv>=1.0"]
mcp = ["mcp>=1.20,<2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
insidethegame-mcp = "insidethegame.mcp_server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insidethegame = ["data/*.json", "data/replay/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
