<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Inside the Game – Commentary Room</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#0b1320;color:#e6edf3}
header{display:flex;gap:10px;align-items:center;padding:10px 16px;background:#111a2b;flex-wrap:wrap}
header select,header input,header button{background:#1b2638;color:#e6edf3;border:1px solid #2d3b55;border-radius:6px;padding:5px 8px}
#score{font-size:22px;font-weight:700;margin-left:auto}
main{display:grid;grid-template-columns:2fr 1fr;gap:12px;padding:12px}
#pitchwrap{position:relative}
canvas{width:100%;background:#1d6b35;border-radius:8px;display:block}
#cards{position:absolute;top:10px;right:10px;width:44%;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.card{background:rgba(8,14,26,.88);border-left:5px solid #888;border-radius:6px;padding:8px 10px;font-size:15px;
 animation:in .3s ease-out;box-shadow:0 2px 8px #0008}
.card h4{margin:0 0 3px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;opacity:.85}
.card .meta{font-size:10px;opacity:.55;margin-top:4px}
.p5{border-color:#ffd33d}.p4{border-color:#f78166}.p3{border-color:#a371f7}.p2,.p1{border-color:#3fb950}
@keyframes in{from{opacity:0;transform:translateX(20px)}to{opacity:1}}
#gauge{height:10px;background:#333;border-radius:5px;overflow:hidden;margin:8px 0}
#gauge div{height:100%;background:linear-gradient(90deg,#1f6feb,#d4380d);transition:width .5s}
aside{display:flex;flex-direction:column;gap:10px;max-height:88vh}
aside section{background:#111a2b;border-radius:8px;padding:8px 10px;overflow:auto}
#feed{list-style:none;margin:0;padding:0;flex:1}
#feed li{padding:6px 8px;border-left:4px solid #555;margin-bottom:6px;background:#0d1626;border-radius:4px;font-size:13px}
#trace{font-family:ui-monospace,monospace;font-size:11px;max-height:34vh}
#trace .b{border-top:1px solid #2d3b55;padding-top:4px;margin-top:4px}
.ag{display:inline-block;min-width:78px;color:#79c0ff}.ok{color:#3fb950}.bad{color:#f85149}.dim{opacity:.55}
h3{margin:4px 0 6px;font-size:14px}small{opacity:.6}
</style></head><body>
<header>
  <strong>Inside the Game</strong><small>synthetic data · fictional teams</small>
  <label>Mode <select id="mode"><option value="fan">Fan</option><option value="analyst">Analyst</option></select></label>
  <label>Language <select id="lang"><option>en</option><option>es</option><option>fr</option></select></label>
  <label>Club <select id="club"><option value="">—</option></select></label>
  <label>Player <select id="player"><option value="">—</option></select></label>
  <label>Speed <input id="speed" type="number" value="20" style="width:55px"></label>
  <label>Seed <input id="seed" type="number" value="7" style="width:50px"></label>
  <button id="go">Kick off</button>
  <span id="score">– : –</span>
</header>
<main>
  <section id="pitchwrap"><canvas id="pitch" width="1050" height="680"></canvas><div id="cards"></div>
    <div><small>Control ← home | away → · chaos <b id="chaos">0</b> · phase <b id="phase">–</b> · <b id="clock">0'</b>
      · <span id="usage" class="dim"></span></small>
    <div id="gauge"><div style="width:50%"></div></div></div></section>
  <aside>
    <section style="flex:1"><h3>Commentary room</h3><ul id="feed"></ul></section>
    <section><h3>Agent trace <small id="orch"></small></h3><div id="trace"></div></section>
  </aside>
</main>
<script>
const $=id=>document.getElementById(id), cv=$("pitch"), cx=cv.getContext("2d");
let es=null, meta=null, trail=[], marks=[];
const viewer=localStorage.itgViewer||(localStorage.itgViewer="v"+Math.random().toString(36).slice(2,8));
function drawPitch(){cx.fillStyle="#1d6b35";cx.fillRect(0,0,1050,680);cx.strokeStyle="#ffffff88";cx.lineWidth=3;
 cx.strokeRect(5,5,1040,670);cx.beginPath();cx.moveTo(525,5);cx.lineTo(525,675);cx.stroke();
 cx.beginPath();cx.arc(525,340,91,0,7);cx.stroke();cx.strokeRect(5,138,165,404);cx.strokeRect(880,138,165,404);}
const isHome=t=>!meta||t===meta.home.id, col=t=>meta?(isHome(t)?meta.home.color:meta.away.color):"#fff";
function P(team,x,y){return isHome(team)?[x*10,y*10]:[(105-x)*10,(68-y)*10];}
function render(){drawPitch();
 trail.forEach((p,i)=>{cx.globalAlpha=(i+1)/trail.length*.8;cx.strokeStyle=p.c;cx.lineWidth=2;cx.beginPath();cx.moveTo(...p.a);cx.lineTo(...p.b);cx.stroke();});
 cx.globalAlpha=1;const now=Date.now();marks=marks.filter(m=>m.until>now);
 marks.forEach(m=>{const v=m.viz;cx.strokeStyle=cx.fillStyle="#ffd33d";cx.lineWidth=4;
  if(v.kind==="shot_marker"){const [x,y]=P(v.team,v.x,v.y);cx.beginPath();cx.arc(x,y,8+40*(v.value||0),0,7);cx.stroke();
   cx.font="bold 18px system-ui";cx.fillText(`xG ${v.value??""}`,x+12,y-12);}
  if(v.kind==="pass_arrow"){const a=P(v.team,v.x,v.y),b=P(v.team,v.end_x,v.end_y);cx.beginPath();cx.moveTo(...a);cx.lineTo(...b);cx.stroke();
   cx.beginPath();cx.arc(...b,7,0,7);cx.fill();cx.font="bold 16px system-ui";cx.fillText(`+${v.value} xT`,b[0]+10,b[1]);}});}
function showCard(c){const d=document.createElement("div");d.className="card p"+c.priority;
 d.innerHTML=`<h4>${c.minute}' · ${c.title}</h4>${c.text}<div class="meta">${c.type} · p${c.priority} · ${c.source}${c.verified?" · ✓ fact-checked":""}</div>`;
 const box=$("cards");box.prepend(d);while(box.children.length>3)box.lastChild.remove();
 setTimeout(()=>d.remove(),c.ttl_s*1000);
 if(c.viz&&(c.viz.kind==="shot_marker"||c.viz.kind==="pass_arrow")){marks.push({viz:c.viz,until:Date.now()+c.ttl_s*1000});render();}
 const li=document.createElement("li");li.style.borderColor=getComputedStyle(d).borderLeftColor||"#555";
 li.innerHTML=`<small>${c.minute}' ${c.type}</small> ${c.text}`;$("feed").prepend(li);}
function showTrace(d){const box=$("trace"),div=document.createElement("div");div.className="b";
 const r=d.report||{};let h=`<div class="dim">minute ${d.minute} · ${r.accepted??0}/${r.received??0} events · dups ${r.duplicates??0} · anomalies ${(r.anomalies||[]).length}</div>`;
 d.trace.forEach(t=>{let s=`<span class="ag">${t.agent}</span>${t.ms}ms`;
  if(t.llm)s+=` · ${t.llm}`;if(t.tokens_in)s+=` · ${t.tokens_in}→${t.tokens_out} tok`;if(t.tool_calls)s+=` · 🔧${t.tool_calls} MCP`;
  if(t.factcheck)s+=` · <span class="${t.factcheck==="pass"?"ok":"bad"}">fact-check ${t.factcheck}</span>`;
  if(t.factcheck_rejected&&(t.factcheck_rejected.length||t.factcheck_rejected>0))s+=` · <span class="bad">rejected ${JSON.stringify(t.factcheck_rejected).slice(0,90)}</span>`;
  if(t.chosen)s+=` · chose ${t.chosen.length}/${t.candidates}`;if(t.error)s+=` · <span class="bad">${t.error}</span>`;
  h+=`<div>${s}</div>`;});div.innerHTML=h;box.prepend(div);while(box.children.length>8)box.lastChild.remove();
 const u=d.usage;$("usage").textContent=`${u.calls} LLM calls · ${u.input_tokens+u.output_tokens} tokens · $${u.usd}`;$("orch").textContent=d.orchestrator;}
function setScore(s){if(meta&&s)$("score").textContent=`${meta.home.short} ${s[meta.home.id]??0} : ${s[meta.away.id]??0} ${meta.away.short}`;}
function setIndex(i){if(i&&i.control&&meta){const h=i.control[meta.home.id],a=i.control[meta.away.id];
 $("gauge").firstElementChild.style.width=(100*h/((h+a)||1))+"%";$("chaos").textContent=i.chaos;}}
$("go").onclick=()=>{if(es)es.close();$("feed").innerHTML="";$("trace").innerHTML="";$("cards").innerHTML="";trail=[];marks=[];
 const q=new URLSearchParams({seed:$("seed").value,speed:$("speed").value,mode:$("mode").value,lang:$("lang").value,club:$("club").value,player:$("player").value,viewer});
 es=new EventSource("/api/stream?"+q);
 es.addEventListener("tick",m=>{const d=JSON.parse(m.data),ev=d.event;
  if(ev.type==="match_start"){meta=ev.meta;fillSelectors();}
  if(ev.type==="pass"&&meta){trail.push({a:P(ev.team,ev.x,ev.y),b:P(ev.team,ev.end_x,ev.end_y),c:col(ev.team)});if(trail.length>12)trail.shift();render();}
  if(ev.type==="goal")setScore(ev.score);$("clock").textContent=ev.minute+"'";});
 es.addEventListener("cards",m=>{const d=JSON.parse(m.data);d.cards.slice().reverse().forEach(showCard);showTrace(d);setScore(d.score);setIndex(d.index);$("phase").textContent=d.phase;});
 es.addEventListener("end",()=>es.close());};
function fillSelectors(){const cl=$("club"),pl=$("player");if(cl.options.length>1)return;
 [meta.home,meta.away].forEach(t=>{cl.add(new Option(t.name,t.id));t.players.forEach(p=>pl.add(new Option(`${p.name} (${t.short})`,p.id)));});}
drawPitch();
fetch("/api/match?seed=7").then(r=>r.json()).then(j=>{meta=j.events[0].meta;fillSelectors();});
</script></body></html>
